<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>汐鮨｜JJ鮮魚</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei";
}

html{
    scroll-behavior:smooth;
}

body{
    background:white;
    color:#000033;
}

/* 選單 */

.menu-container{
    position:fixed;
    top:20px;
    left:20px;
    z-index:999;
}

.menu-btn{
    background:#00001F;
    color:white;
    border:none;
    font-size:28px;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.menu-btn:hover{
    background:#1a1a4d;
}

.menu{
    display:none;
    margin-top:10px;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    overflow:hidden;
}

.menu a{
    display:block;
    padding:15px 30px;
    color:#00001F;
    text-decoration:none;
}

.menu a:hover{
    background:#f0f0f0;
}

/* Header */

header{
    background:#00001F;
    color:white;
    padding:100px 20px;
    text-align:center;
}

header h1{
    margin-bottom:20px;
}

header p{
    font-size:22px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 40px;
    background:white;
    color:#00001F;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

/* 內容區 */

section{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

h2{
    color:#000033;
    margin-bottom:30px;
    font-size:40px;
}

.about p{
    font-size:20px;
    line-height:1.8;
}

/* 商品區 */

.portfolio{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 30px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:.5s;
}

.card:hover img{
    transform:scale(1.05);
}

.card h3{
    padding:20px;
    text-align:center;
}

/* Footer */

footer{
    background:#000033;
    color:white;
    text-align:center;
    padding:40px;
    line-height:2;
}

/* 動畫 */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

header h1,
header p,
.btn{
    animation:fadeUp 1s ease forwards;
}

/* 手機版 */

@media(max-width:768px){

    header h1 img{
        width:220px;
    }

    .portfolio{
        grid-template-columns:1fr;
    }

    h2{
        font-size:32px;
    }

}
    .order-btn{
    display:inline-block;
    margin-top:30px;
    margin-left:15px;
    padding:15px 40px;
    background:white;
    color:#00001F;
    border:2px solid white;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.order-btn:hover{
    background:#f5f5f5;
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

</style>

</head>

<script>

function toggleMenu(){

    const menu = document.getElementById("menu");

    if(menu.style.display === "block"){
        menu.style.display = "none";
