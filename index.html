*{
margin:0;

box-sizing:border-box;

}

body{

}

header{

padding:80px 20px;

}

header h1{

header p{

.btn{

    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.2);

{

padding:15px 40px;

section{

font-size:40px;
}

.about p{
font-size:20px;
line-height:1.8;
}

.portfolio{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:250px;

}

.card h3{

footer{
background:#23237d;
color:white;
text-align:center;
padding:40px;
}

@media(max-width:768px){

header h1{
font-size:40px;
}

.portfolio{
grid-template-columns:1fr;
}

}
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

header h1,
header p,
.btn{
    animation:fadeUp 1s ease forwards;
}

header p{
    animation-delay:.3s;
}

.btn{
    animation-delay:.6s;
}

</style>
</head>

<section class="about">
<h2>關於我們</h2>

<p>
源自宜蘭沿岸純淨海域的優質海鮮，秉持新鮮至上的理念，嚴選在地漁港每日現撈魚貨。依循季節漁汛，當季捕撈、產地直送，讓每一份海鮮都保留最鮮甜的海洋原味與豐富營養。從漁船靠岸到送達餐桌，全程嚴格把關品質，減少不必要的運輸與等待時間，只為呈現最真實、最鮮美的海味。以誠信經營為原則，讓消費者吃得安心、買得放心，將宜蘭海岸最純粹的新鮮滋味分享給每一位顧客。</p>
